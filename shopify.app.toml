# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "01ba7b33c8adc70fb904a1a529c99f78"
name = "IntentCart"
handle = "intentcart"
application_url = "https://shop-chat-agent-production-3220.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Add following additional scopes when configuring customer accounts authentication: customer_read_customers,customer_read_orders,customer_read_store_credit_account_transactions,customer_read_store_credit_accounts
scopes = "unauthenticated_read_product_listings,write_app_proxy"

[app_proxy]
url = "https://shop-chat-agent-production-3220.up.railway.app/widget"
prefix = "apps"
subpath = "intentcart"

[auth]
redirect_urls = [
  "https://shop-chat-agent-production-3220.up.railway.app/auth/callback"
]

[pos]
embedded = false

[customer_authentication]
redirect_uris = [
  "https://shop-chat-agent-production-3220.up.railway.app/customer-auth/callback"
]
