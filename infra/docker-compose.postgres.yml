services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: intentcart
      POSTGRES_USER: intentcart
      POSTGRES_PASSWORD: intentcart
    ports:
      - "5433:5432"
    volumes:
      - intentcart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentcart -d intentcart"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  intentcart_postgres_data:
